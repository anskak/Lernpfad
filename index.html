<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kapitäns-Karte</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kapitäns-Karte">
<meta name="theme-color" content="#5A3519">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>@font-face{font-family:"Nunito";font-weight:600;font-style:normal;font-display:swap;src:url("nunito-600.woff2") format("woff2")}@font-face{font-family:"Nunito";font-weight:700;font-style:normal;font-display:swap;src:url("nunito-700.woff2") format("woff2")}@font-face{font-family:"Nunito";font-weight:800;font-style:normal;font-display:swap;src:url("nunito-800.woff2") format("woff2")}@font-face{font-family:"Nunito";font-weight:900;font-style:normal;font-display:swap;src:url("nunito-900.woff2") format("woff2")}@font-face{font-family:"Pirata One";font-weight:400;font-style:normal;font-display:swap;src:url("pirata-one-400.woff2") format("woff2")}</style>
<script src="xlsx.full.min.js"></script>
<style>
/* Eine Welt: Pergament-Seekarte unter einer Holzleiste, Messing für Codes und Schätze. Ein Bildschirm pro Schritt, große Tippflächen fürs iPad und den Beamer. */
:root{
  --parch:#F4E7C5; --parch-2:#E7D19E; --paper:#FBF5E4; --ink:#3A2716; --muted:#7A6247;
  --wood:#6E4426; --wood-d:#40260F; --brass:#C2923A; --brass-l:#F0D78E; --sea:#3D7F8C; --sea-l:#C6E0D8;
  --ok:#2E7A4C; --ok-soft:#DCEBCF; --bad:#B1372B; --bad-soft:#F6D8CD;
  --display:"Pirata One",Georgia,serif; --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{background:#E9D6A6}
body{background:radial-gradient(ellipse at 50% 30%,#F8EDCF 0%,#F1E1B7 55%,#E2C88F 100%);color:var(--ink);font-family:var(--body);font-weight:700;
  padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#7B4C2A,#5A3519 70%,#4A2A12);border-bottom:4px solid var(--brass);box-shadow:0 3px 10px rgba(60,30,10,.35);color:var(--brass-l)}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:32px;letter-spacing:.5px}
.top .sp{flex:1}
.ghost{background:rgba(255,240,200,.08);color:var(--brass-l);padding:8px 14px;border-radius:10px;font-size:15px;border:1px solid rgba(240,215,142,.35)}
.ghost:hover{background:rgba(255,240,200,.18)}
.screen{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
h2{font-family:var(--display);font-weight:400;font-size:44px;margin:4px 0 14px;text-wrap:balance;line-height:1.05}
.sub{color:var(--muted);font-size:19px;margin:-6px 0 16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar .sp{flex:1}
.grid{display:grid;gap:12px}
.names{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.big{background:var(--paper);border:2px solid #CDB27A;border-radius:14px;padding:18px 14px;font-size:23px;font-weight:800;text-align:center;min-height:74px;box-shadow:0 2px 0 #CDB27A}
.big:hover{border-color:var(--wood)}
.big small{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-top:4px}
.back{background:rgba(110,68,38,.1);border-radius:12px;padding:10px 16px;font-size:17px;color:var(--wood-d)}
.back:hover{background:rgba(110,68,38,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wood-d);color:var(--brass-l);border-radius:999px;padding:8px 16px;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px;fill:var(--brass-l)}
.empty{color:var(--muted);font-size:19px;padding:40px 0;text-align:center;line-height:1.5}

/* Karte */
.map{background:var(--paper);border:3px solid var(--wood);border-radius:14px;box-shadow:inset 0 0 0 6px #EBD9AE,0 4px 14px rgba(60,30,10,.18);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.stagebox{border:2px dashed #D9C291;border-radius:12px;padding:12px 14px;margin-top:14px;background:#FFFCF2}
.map svg{display:block;height:auto;max-width:none}
.lbl{font:800 17px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.lbl.sm{font-size:15px}
.lbl.muted{fill:#9A8466}
.stx{font:900 15px var(--body);fill:var(--brass);paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.stx.off{fill:#BFAE8C}
.tap{cursor:pointer}
.tap:hover .sand{stroke:var(--wood-d);stroke-width:3}
.closed{opacity:.32}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.25;transform:scale(1.12)}}
.route{fill:none;stroke:var(--bad);stroke-width:3.5;stroke-dasharray:2 11;stroke-linecap:round;opacity:.75}
.splink{fill:none;stroke:var(--wood);stroke-width:2.5;stroke-dasharray:1 8;stroke-linecap:round;opacity:.6}
.wake{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}

/* Klassenschatz */
.treasure{display:flex;align-items:center;gap:14px;margin-top:14px;background:linear-gradient(180deg,#6E4426,#4F2F15);border-radius:14px;padding:12px 16px;color:var(--brass-l);border:2px solid var(--brass)}
.treasure .ico{width:54px;flex:none}
.treasure .txt{flex:1;min-width:0}
.treasure .t1{font-size:18px;font-weight:900}
.treasure .t2{font-size:15px;opacity:.85}
.meter{height:20px;border-radius:999px;background:#2E1A0A;margin-top:8px;overflow:hidden;border:1px solid rgba(240,215,142,.4)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#B8862F,#F3D27A 60%,#FFE9A8);border-radius:999px;transition:width 1s ease}
.treasure.big{padding:20px 24px}
.treasure.big .t1{font-size:30px}
.treasure.big .t2{font-size:20px}
.treasure.big .meter{height:32px}
.treasure.big .ico{width:90px}

/* Schloss */
.lockbox{display:flex;flex-direction:column;align-items:center;gap:14px}
.chest{width:210px;height:auto;overflow:visible}
.chest .lid{transition:transform .8s cubic-bezier(.3,1.5,.5,1);transform-origin:20px 82px}
.chest .gold,.chest .glow{opacity:0;transition:opacity .6s ease .35s}
.chest.open .lid{transform:rotate(-24deg) translate(-4px,-30px)}
.chest.open .gold,.chest.open .glow{opacity:1}
.chest.shake{animation:shake .55s ease}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px) rotate(-3deg)}30%{transform:translateX(10px) rotate(3deg)}45%{transform:translateX(-8px) rotate(-2deg)}60%{transform:translateX(6px) rotate(1deg)}80%{transform:translateX(-3px)}}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px 16px 26px;background:linear-gradient(180deg,#D9B661,#B08532 45%,#8C6620);border-radius:18px;box-shadow:inset 0 2px 0 #F6E3A6,0 4px 10px rgba(60,30,10,.3)}
.slot{width:76px;height:96px;border-radius:12px;border:3px solid #6B4C18;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;position:relative;color:#FBEFC9;
  background:linear-gradient(180deg,#160D05 0%,#4A3320 20%,#5E422A 50%,#4A3320 80%,#160D05 100%);font-variant-numeric:tabular-nums}
.slot.cur{box-shadow:0 0 0 4px #FFF2C4}
.slot.ok{border-color:var(--ok);background:linear-gradient(180deg,#0C2414,#2E7A4C 50%,#0C2414)}
.slot.bad{border-color:#FF8E7F;background:linear-gradient(180deg,#2A0A06,#B1372B 50%,#2A0A06);animation:blink .9s ease 2}
@keyframes blink{50%{filter:brightness(1.5)}}
.slot small{position:absolute;bottom:-25px;font-size:16px;color:#3B260C}
.pad{display:grid;grid-template-columns:repeat(3,96px);gap:10px}
.pad button{height:74px;border-radius:16px;background:var(--paper);border:2px solid #CDB27A;box-shadow:0 3px 0 #B9995C;font-size:34px;font-weight:900}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #B9995C}
.pad .wide{font-size:19px}
.check{background:linear-gradient(180deg,#7B4C2A,#4F2F15);color:var(--brass-l);border:2px solid var(--brass);border-radius:16px;padding:16px 40px;font-size:25px;font-weight:900}
.check:disabled{opacity:.35;cursor:default}
.check.alt{background:var(--paper);color:var(--wood-d);border-color:#CDB27A}
.msg{font-size:22px;min-height:30px;text-align:center;max-width:640px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.tries{color:var(--muted);font-size:17px}
.stars{display:inline-flex;gap:4px;vertical-align:middle}
.star{width:26px;height:26px;fill:var(--brass)}
.star.off{fill:#CDBB93}

/* Gewonnen */
.win{text-align:center;padding:60px 10px 30px;position:relative}
.win .h{font-family:var(--display);font-size:76px;margin:0;color:var(--wood-d)}
.win .n{font-size:26px;color:var(--muted);margin:6px 0 18px}
.win .stars{justify-content:center;gap:10px}
.win .star{width:70px;height:70px;animation:pop .5s ease both}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:scale(1);opacity:1}}
.stage{position:relative;display:inline-block}
.burst{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
.coin{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4C2,#F2C94C 45%,#B8862F 80%);border:2px solid #8C6620;opacity:0;animation:fly 1.6s cubic-bezier(.2,.7,.4,1) var(--d) both}
@keyframes fly{0%{transform:translate(0,0) scale(.3);opacity:0}12%{opacity:1}55%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r))}100%{transform:translate(calc(var(--dx) * 1.35),calc(var(--dy) + 280px)) scale(.9) rotate(calc(var(--r) * 2));opacity:0}}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* Vergleich, Weggabelung */
.card{background:var(--paper);border:2px solid #CDB27A;border-radius:16px;padding:20px;max-width:720px;margin:0 auto}
.card p{font-size:20px;line-height:1.45;margin:0 0 12px}
.parts{display:grid;gap:10px;margin:16px 0}
.part{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.part b{font-size:26px;width:40px}
.tog{background:#fff;border:2px solid #CDB27A;border-radius:12px;padding:12px 18px;font-size:19px}
.tog[aria-pressed="true"].y{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tog[aria-pressed="true"].n{background:#FFF0C9;border-color:var(--brass);color:#7A5A1E}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.way{background:var(--paper);border:3px solid #CDB27A;border-radius:18px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px}
.way[aria-pressed="true"]{border-color:var(--wood-d);box-shadow:0 0 0 4px var(--brass-l)}
.way .t{font-family:var(--display);font-size:36px}
.way ul{margin:0;padding-left:20px;font-size:17px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--wood-d);color:var(--brass-l);padding:14px 22px;border-radius:14px;font-size:20px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;border:2px solid var(--brass);z-index:5}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Lehrkraft */
.panel{background:var(--paper);border:2px solid #D9C291;border-radius:14px;padding:18px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:20px}
.panel h4{margin:16px 0 8px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:#EEDFB9;border-radius:10px;padding:10px 14px;font-size:16px;color:var(--ink)}
.btn:hover{background:#E5D2A2}
.btn.pri{background:var(--wood-d);color:var(--brass-l)}
.btn.warn{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:15px}
input[type=text],input[type=password],input[type=number],textarea,select{background:#fff;border:2px solid #D9C291;border-radius:10px;padding:9px 11px;font-size:16px}
textarea{width:100%;min-height:140px;resize:vertical;font-weight:600}
label.cb{display:inline-flex;align-items:center;gap:8px;font-size:16px}
label.cb input{width:22px;height:22px;accent-color:var(--wood)}
.note{color:var(--muted);font-size:14px;font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 6px;border-bottom:1px solid #E3D2A9;text-align:center;white-space:nowrap}
th{font-size:13px;color:var(--muted)}
th.grp{font-size:13px;color:var(--wood-d);background:#F1E4C0;border-bottom:0}
th:first-child,td:first-child{text-align:left}
td button{background:transparent;border-radius:8px;padding:4px 8px;font-size:15px}
td button:hover{background:#F1E4C0}
.mini{background:#EEDFB9!important;border-radius:8px;padding:4px 8px;font-size:13px;margin:1px}
.mini.ok{background:var(--ok-soft)!important;color:var(--ok)}
.c-ok{color:var(--ok);font-weight:900} .c-lock{color:var(--bad)} .c-try{color:#9A6A12}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:#EEDFB9;border-radius:10px;padding:10px 16px;font-size:17px}
.tabs button[aria-pressed="true"]{background:var(--wood-d);color:var(--brass-l)}
.warnbar{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.infobar{background:#FFF0C9;color:#6B4C18;border-radius:12px;padding:10px 14px;margin:0 0 14px}
.isl-row{display:grid;grid-template-columns:minmax(150px,1.6fr) 140px 90px minmax(170px,1.4fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed #E3D2A9}
.isl-row input,.isl-row select{width:100%}
.isl-row .ext{display:flex;gap:6px;align-items:center}
.isl-row .ctl{display:flex;gap:4px}
.sec{border-left:5px solid var(--brass);padding-left:12px;margin-top:16px}
.sec.wp{border-color:var(--sea)}
.sec.sp{border-color:#9AAE6A}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.miss{border-color:var(--bad)!important}
.isl-row details{grid-column:1/-1}
.isl-row summary{cursor:pointer;color:var(--wood);font-size:15px}
.isl-row details textarea{min-height:80px;margin-top:6px}
.tips{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-width:640px}
.tips li{background:#FFF0C9;border:2px solid var(--brass);border-radius:12px;padding:10px 14px;font-size:20px;color:#5A3D0C}
.phs{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.ph{position:relative;background:#fff;border:2px solid #CDB27A;border-radius:12px;padding:4px;display:block}
.ph img{display:block;height:150px;width:auto;max-width:280px;object-fit:contain;border-radius:8px;background:#F3EAD3}
.phs.wide .ph img{height:260px;max-width:100%}
.ph .x{position:absolute;top:-10px;right:-10px;background:var(--bad);color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px}
.addph{display:inline-flex;align-items:center;justify-content:center;height:150px;width:150px;border:2px dashed #CDB27A;border-radius:12px;color:var(--wood);font-size:16px;text-align:center;cursor:pointer;padding:10px}
.codeview{display:flex;gap:6px;flex-wrap:wrap}
.codeview span{background:var(--wood-d);color:var(--brass-l);border-radius:8px;padding:6px 10px;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.codeview small{font-size:13px;opacity:.8;margin-right:3px}
.sol h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:13px;background:#EEDFB9;border-radius:999px;padding:3px 10px;color:var(--wood-d);font-weight:800}
.imp ul{margin:6px 0;padding-left:20px}
.imp .bad{color:var(--bad)}
.err-row{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px dashed #E3D2A9;flex-wrap:wrap}
.err-row b{min-width:34px;font-variant-numeric:tabular-nums}
.lightbox{position:fixed;inset:0;background:rgba(30,18,8,.92);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px 12px}
.lightbox.on{display:flex}
.lightbox .lbwrap{overflow:auto;max-width:100%;max-height:100%}
.lightbox img{max-width:100%;max-height:calc(100vh - 90px);display:block;cursor:zoom-in}
.lightbox img.full{max-width:none;max-height:none;cursor:zoom-out}
.lightbox .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;background:var(--brass-l);color:var(--wood-d);border-radius:12px;padding:10px 18px;font-size:19px;font-weight:900}
.win2{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:24px;align-items:center;padding-top:30px}
.win2 .wl{position:relative}
.win2 .chest{width:170px}
.win2 .h{font-size:68px}
.map.static{pointer-events:none}
@media (max-width:900px){.win2{grid-template-columns:1fr}}
@media (max-width:820px){.isl-row{grid-template-columns:1fr 1fr}.isl-row .ctl{grid-column:span 2}}
@media (max-width:640px){.slot{width:52px;height:70px;font-size:36px}.pad{grid-template-columns:repeat(3,78px)}.pad button{height:62px}h2{font-size:34px}.win .h{font-size:54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.coin{display:none}}
</style>
</head>
<body>
<div class="top">
  <h1>Kapitäns-Karte</h1><span class="sp"></span>
  <button class="ghost" id="teacherBtn" type="button">Lehrkraft</button>
</div>
<main class="screen" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<div class="lightbox" id="lb" role="dialog" aria-label="Lösung groß"><button class="close" id="lbx" type="button">Schließen</button><div class="lbwrap"><img id="lbi" alt="Lösung"></div></div>

<script>
/* ================= Speicher ================= */
const KEY="kapitaens-karte-v1";
let canStore=true;
const uid=()=>Math.random().toString(36).slice(2,10);
function blank(){return {v:1,pin:"",maxTries:3,teacher:"deine Lehrkraft",checkRate:0.25,sound:false,lastBackup:0,classes:[],adventures:[],progress:{}}}
function mkIsl(name,type,stars,sec,extra){return Object.assign({id:uid(),name,type,stars,sec,code:"",parts:3,hint:"",after:"",traps:[],photos:[]},extra||{})}
function seed(){
  const s=blank();
  const c={id:uid(),name:"Beispielklasse",demo:true,students:["Möwe","Krake","Delfin","Seestern","Qualle","Robbe"].map(n=>({id:uid(),name:n}))};
  s.classes.push(c);
  const a1={id:uid(),name:"Kapitän Minus",classIds:[c.id],active:true,seq:false,forkAfterBase:true,b1:"Wahlpflicht 1",b2:"Wahlpflicht 2",goalPerKid:6,goalText:"5 Minuten Spielzeit",

    if(status_==="pending")g+=`<g transform="translate(${p.x},${p.y})"><circle r="${rr*.42}" fill="#FBF5E4" stroke="#C2923A" stroke-width="3"/><path d="M${-rr*.18},${-rr*.24} h${rr*.36} l${-rr*.36},${rr*.48} h${rr*.36}z" fill="#C2923A" stroke="#40260F" stroke-width="2"/></g>`;
    if(status_==="fog")g+=`<g filter="url(#fogb)" opacity=".93"><circle cx="${p.x-rr*.45}" cy="${p.y+rr*.1}" r="${rr*.75}" fill="#FBF5E4"/><circle cx="${p.x+rr*.4}" cy="${p.y-rr*.15}" r="${rr*.8}" fill="#FBF5E4"/><circle cx="${p.x}" cy="${p.y+rr*.35}" r="${rr*.7}" fill="#FBF5E4"/></g>`;

      <rect x="${p.x-4}" y="${p.y-r*.9}" width="8" height="${r*1.8}" fill="#6E4426" stroke="#40260F" stroke-width="2"/>
      <path d="M${p.x+2},${p.y-r*.8} h${r*1.1} l${r*.25},${r*.22} l${-r*.25},${r*.22} h${-r*1.1}z" fill="${ch===1?"#C2923A":"#A8774A"}" stroke="#40260F" stroke-width="2"/>
      <path d="M${p.x+2},${p.y+r*.15} h${r*1.1} l${r*.25},${r*.22} l${-r*.25},${r*.22} h${-r*1.1}z" fill="${ch===2?"#C2923A":"#A8774A"}" stroke="#40260F" stroke-width="2"/>
      <text x="${p.x+r*.6}" y="${p.y-r*.52}" text-anchor="middle" style="font:900 ${Math.round(r*.36)}px var(--body);fill:#FBF5E4">1</text>

      ${(()=>{const cs=[st.L1,st.L2].filter(L=>L.length).map(L=>{const xs=L.map(i=>P[i.id].x);return (Math.min(...xs)+Math.max(...xs))/2-p.x});return !cs.length||Math.min(...cs)>150})()?`<text x="${p.x}" y="${p.y+r+30}" text-anchor="middle" class="lbl sm">Weggabelung</text>`:""}<title>Weggabelung</title></g>`;

  return out.replace("__FX__",fx.toFixed(0))+"</svg>";

let V={s:"class"},idleT;
function go(v){V=v;clearTimeout(idleT);render();window.scrollTo(0,0)}
const cls=()=>S.classes.find(c=>c.id===V.cls);
const advsFor=c=>S.adventures.filter(a=>a.active&&a.classIds.includes(c.id));
const adv=()=>S.adventures.find(a=>a.id===V.aid);
const stu=()=>cls()?.students.find(s=>s.id===V.sid);
const toNames=()=>go({s:"name",cls:V.cls,aid:V.aid});
function idle(ms,fn){clearTimeout(idleT);idleT=setTimeout(fn||toNames,ms)}

function render(){
  document.getElementById("teacherBtn").textContent=V.s==="teacher"?"Zurück zur Karte":"Lehrkraft";
  if(V.s==="teacher")return teacher();
  if(!S.classes.length){app.innerHTML=`<div class="empty">Noch keine Klasse angelegt.<br>Tippe oben rechts auf <b>Lehrkraft</b>.</div>`;return}
  if(V.s==="class"){
    if(S.classes.length===1){V={s:"adv",cls:S.classes[0].id};return render()}
    app.innerHTML=`<h2>Welche Klasse?</h2><div class="grid names">${S.classes.map(c=>`<button class="big" data-act="pickClass" data-id="${c.id}">${esc(c.name)}</button>`).join("")}</div>`;return}
  const c=cls();if(!c)return go({s:"class"});
  if(V.s==="adv"){
    const L=advsFor(c);
    if(L.length===1){V={s:"name",cls:c.id,aid:L[0].id};return render()}
    const bk=S.classes.length>1?`<button class="back" data-act="toClass">← Klasse</button>`:"";
    if(!L.length){app.innerHTML=`${bk}<div class="empty">Für ${esc(c.name)} ist gerade kein Abenteuer aktiv.<br>${esc(S.teacher)} schaltet eins frei.</div>`;return}
    app.innerHTML=`${bk}<h2>Welches Abenteuer?</h2><div class="grid names">${L.map(a=>`<button class="big" data-act="pickAdv" data-id="${a.id}">${esc(a.name)}<small>${a.islands.length} Inseln</small></button>`).join("")}</div>`;return}
  const a=adv();if(!a||!a.active||!a.classIds.includes(c.id))return go({s:"adv",cls:c.id});
  if(V.s==="name"){
    const many=advsFor(c).length>1,bk=many?`<button class="back" data-act="toAdv">← Abenteuer</button>`:S.classes.length>1?`<button class="back" data-act="toClass">← Klasse</button>`:"";
    const st=[...c.students].sort((x,y)=>x.name.localeCompare(y.name,"de"));
    app.innerHTML=`<div class="bar">${bk}<span class="sp"></span><button class="back" data-act="beamer">Klassenkarte zeigen</button></div>
      <h2>Wer bist du?</h2><p class="sub">${esc(a.name)}</p>
      <div class="grid names">${st.map(s=>`<button class="big" data-act="pickKid" data-id="${s.id}">${esc(s.name)}</button>`).join("")}</div>`;return}
  if(V.s==="beamer"){
    app.innerHTML=`<div class="bar"><button class="back" data-act="toNames">← Zurück</button></div>
      <h2>${esc(a.name)} · ${esc(c.name)}</h2>
      <div class="map">${mapSvg(a,{mode:"class",cls:c})}</div>${treasure(a,c,true)}`;return}
  const k=stu();if(!k)return toNames();
  if(V.s==="map"){
    app.innerHTML=`<div class="bar"><button class="back" data-act="toNames">← Das bin ich nicht</button><span class="sp"></span>
      <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true">${STAR}</svg>${kidStars(a,k.id)} von ${maxStars(a)}</span></div>
      <h2>Ahoi, ${esc(k.name)}!</h2><p class="sub">${esc(a.name)} · Wohin segelst du? Tippe auf deine Insel.</p>
      <div class="map">${mapSvg(a,{mode:"kid",sid:k.id})}</div>${treasure(a,c,false)}`;
    idle(60000);return}
  if(V.s==="fork")return forkScreen(a,k);
  const isl=a.islands.find(i=>i.id===V.iid);if(!isl)return go({...V,s:"map"});
  if(V.s==="isl"){
    if(isl.type==="code")return codeScreen(a,k,isl);

}

function head(a,k,isl){return `<div class="bar"><button class="back" data-act="toMap">← Zur Karte</button><span class="sp"></span>${starsHtml(+isl.stars||0)}</div><h2>${esc(isl.name)}</h2>`}

function codeScreen(a,k,isl){
  const p=IP(k.id,a.id,isl.id),code=String(isl.code||""),n=code.length;
  if(!n){app.innerHTML=head(a,k,isl)+`<div class="card"><p>Für diese Insel fehlt noch der Code. Sag ${esc(S.teacher)} Bescheid.</p></div>`;return}
  const lab=n>1?LET:"";
  const res=V.res;
  app.innerHTML=head(a,k,isl)+`<div class="lockbox">
    ${a.chest!==false?`<div class="stage">${CHEST}</div>`:""}
    <div class="slots">${Array.from({length:n},(_,i)=>{const ch=V.val[i]||"";const c2=res?(res[i]?"ok":"bad"):(i===V.val.length?"cur":"");return `<div class="slot ${c2}">${esc(ch)}<small>${lab[i]||""}</small></div>`}).join("")}</div>
    <div class="msg ${res?"bad":""}">${res?(p.locked?`Leider gesperrt. Geh zu ${esc(S.teacher)}.`:"Die roten Felder stimmen nicht. Rechne diese Aufgaben noch einmal."):""}</div>
    ${res&&V.tips&&V.tips.length?`<ul class="tips">${V.tips.map(t=>`<li>${n>1?`<b>${LET[t.pos]})</b> `:""}Tipp: ${esc(t.text)}</li>`).join("")}</ul>`:""}
    ${res||p.locked?"":`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-act="digit" data-d="${d}" type="button">${d}</button>`).join("")}<button class="wide" data-act="del" type="button" aria-label="Löschen">⌫</button><button data-act="digit" data-d="0" type="button">0</button><button class="wide" data-act="clr" type="button">Neu</button></div>`}
    ${res||p.locked?(p.locked?"":`<button class="check" data-act="toNames">Okay, zurück an den Platz</button>`):`<button class="check" data-act="checkCode" ${V.val.length<n?"disabled":""}>Schloss öffnen</button>`}
    <div class="tries">${S.maxTries>0&&!p.locked?`Versuche übrig: ${Math.max(0,S.maxTries-p.tries)}`:""}</div></div>`;
  if(V.shake){V.shake=false;requestAnimationFrame(()=>document.getElementById("chest")?.classList.add("shake"))}
  idle(p.locked?8000:90000);
}
function checkCode(){
  const a=adv(),k=stu(),isl=a.islands.find(i=>i.id===V.iid),p=IP(k.id,a.id,isl.id),code=String(isl.code);
  if(V.val===code){p.done=true;p.at=Date.now();save();sfx("win");return go({...V,s:"win"})}
  p.tries++;if(S.maxTries>0&&p.tries>=S.maxTries)p.locked=true;
  V.res=[...code].map((d,i)=>V.val[i]===d);
  const wrong=V.res.map((ok,i)=>ok?null:{pos:i,d:V.val[i]}).filter(Boolean);
  p.errs=(p.errs||[]).concat(wrong.map(e=>({...e,at:Date.now()}))).slice(-40);
  V.tips=wrong.map(e=>(isl.traps||[]).find(t=>t.pos===e.pos&&t.d===e.d)).filter(Boolean);
  save();sfx("bad");V.shake=true;render();
}

function winScreen(a,k,isl){

function forkScreen(a,k){

function tapIsland(id){
  const a=adv(),k=stu(),isl=a.islands.find(i=>i.id===id);if(!isl)return;
  const st=status(a,k.id,isl),sk=stageOf(isl);
  if(st==="done")return toast("Diese Insel hast du schon geschafft.");
  if(st==="pending")return toast(`Erledigt. ${S.teacher} hakt noch ab.`);
  if(st==="locked")return toast(`Gesperrt. Frag ${S.teacher}.`);
  if(st==="closed")return toast("Du fährst den anderen Weg.");
  if(st==="fog"){
    if(!stageOpen(a,k.id,sk))return toast(`Noch im Nebel. Schaffe erst Etappe ${sk-1}.`);
    if(isl.sec==="sprint"){const an=a.islands.find(i=>i.id===isl.after);return toast(`Noch im Nebel. Schaffe erst ${an?an.name:"die Insel davor"}.`)}
    if((isl.sec==="wp1"||isl.sec==="wp2")&&!forkOpen(a,k.id,sk))return toast("Noch im Nebel. Schaffe erst alle Grundlagen-Inseln.");
    if((isl.sec==="wp1"||isl.sec==="wp2")&&!choiceOf(k.id,a.id,sk))return toast("Wähle zuerst an der Weggabelung deinen Weg.");
    return toast("Noch im Nebel. Schaffe erst die Insel davor.")}
  go({s:"isl",cls:V.cls,aid:V.aid,sid:V.sid,iid:id,val:"",res:null,tips:null,step:0,marks:null});
}

function classTabs(){return S.classes.length>1?`<div class="tabs">${S.classes.map(k=>`<button data-act="tCls" data-id="${k.id}" aria-pressed="${k.id===T.cls}">${esc(k.name)}</button>`).join("")}</div>`:""}

function errorPanel(a,c){

async function readFile(f){
  const buf=await f.arrayBuffer();
  if(/\.(csv|txt)$/i.test(f.name)||!window.XLSX){const t=new TextDecoder().decode(buf);return t.split(/\r?\n/).map(l=>l.split(/[;,\t]/)[0].trim()).filter(Boolean)}
  const wb=XLSX.read(buf,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).map(r=>String(r[0]??"").trim()).filter(Boolean);
}
async function saveFile(filename,data,el){
  el=el||{};
  // 1) Im Claude-Artefakt: Speichern über die Plattform
  if(window.claude&&window.claude.use){
    try{const d=await window.claude.use("downloads");if(d){await d.save({filename,data});el.textContent="Gesichert.";return true}}
    catch(e){el.textContent=e&&e.code==="declined"?"Abgebrochen.":"Sichern hat nicht geklappt.";return false}
  }
  // 2) Home-Bildschirm-App auf dem iPad: Teilen-Menü („In Dateien sichern“)
  const type=/\.csv$/i.test(filename)?"text/csv":"application/json";
  try{const file=new File([data],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});el.textContent="Gesichert. Tipp im Teilen-Menü auf „In Dateien sichern“.";return true}}
  catch(e){if(e&&e.name==="AbortError"){el.textContent="Abgebrochen.";return false}}
  // 3) Sonst: normaler Download
  try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);el.textContent="Gesichert.";return true}
  catch(e){el.textContent="Sichern hat nicht geklappt.";return false}
}
async function exportCsv(){
  const c=S.classes.find(x=>x.id===T.cls),a=S.adventures.find(x=>x.id===T.aid),ST=stagesOf(a),cols=stageIslands(a),forks=ST.filter(s=>s.fork);
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=[["Name",...cols.map(i=>(ST.length>1?`E${stageOf(i)} `:"")+i.name),...forks.map(s=>ST.length>1?`Weg Etappe ${s.k}`:"Weg"),"Sterne"].map(q).join(";")];
  [...c.students].sort((x,y)=>x.name.localeCompare(y.name,"de")).forEach(k=>{
    lines.push([k.name,...cols.map(i=>{const p=peek(k.id,a.id,i.id);return p?.done?"geschafft":p?.pending?"Kontrolle offen":p?.locked?"gesperrt":p?.tries?p.tries+" Fehlversuche":""}),
      ...forks.map(s=>{const ch=choiceOf(k.id,a.id,s.k);return ch?(ch===1?a.b1:a.b2):""}),kidStars(a,k.id)].map(q).join(";"))});
  await saveFile(`Kapitaens-Karte_${c.name}_${a.name}.csv`.replace(/[\\/:*?"<>|]/g,"-"),"﻿"+lines.join("\r\n"),getEl("em"));
}

async function exportAdvs(list){
  const photos={};for(const a of list)for(const i of a.islands)for(const id of i.photos||[]){if(!photos[id]){const v=await photo(id);if(v)photos[id]=v}}
  const d=new Date(),stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const data={kind:"kapitaens-karte-abenteuer",v:1,exported:stamp,adventures:list.map(a=>({...a,classIds:[]})),photos};
  const name=(list.length===1?`Abenteuer_${list[0].name}_${stamp}`:`Abenteuer_alle_${stamp}`).replace(/[\\/:*?"<>|]/g,"-")+".json";
  await saveFile(name,JSON.stringify(data),getEl("axm")||{});
}
async function backup(){
